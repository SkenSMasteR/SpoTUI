name: build sposync

on:
    workflow_dispatch:

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    build-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: install deps
              run: |
                  python -m pip install --upgrade pip
                  pip install -r sposync/requirements.txt pyinstaller

            - name: build linux binary
              run: |
                  pyinstaller --noconfirm --onefile --name sposync-linux-amd64 --collect-all textual --collect-all rich --collect-all soundcard --collect-all numpy --collect-all websockets sposync/app.py
                  mkdir -p sposync/bin
                  mv dist/sposync-linux-amd64 sposync/bin/sposync-linux-amd64
                  chmod +x sposync/bin/sposync-linux-amd64

            - name: attest linux binary
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: sposync/bin/sposync-linux-amd64

            - uses: actions/upload-artifact@v4
              with:
                  name: sposync-linux-amd64
                  path: sposync/bin/sposync-linux-amd64

    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: install deps
              run: |
                  python -m pip install --upgrade pip
                  pip install -r sposync/requirements.txt pyinstaller

            - name: build windows binary
              run: |
                  pyinstaller --noconfirm --onefile --name sposync-win64 --collect-all textual --collect-all rich --collect-all soundcard --collect-all numpy --collect-all websockets sposync/app.py
                  New-Item -ItemType Directory -Force -Path sposync/bin | Out-Null
                  Move-Item -Force dist/sposync-win64.exe sposync/bin/sposync-win64.exe

            - name: attest windows binary
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: sposync/bin/sposync-win64.exe

            - uses: actions/upload-artifact@v4
              with:
                  name: sposync-win64
                  path: sposync/bin/sposync-win64.exe

    publish:
        needs: [build-linux, build-windows]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: sposync-linux-amd64
                  path: out

            - uses: actions/download-artifact@v4
              with:
                  name: sposync-win64
                  path: out

            - name: fetch aux branch
              run: |
                  git fetch origin aux || true
                  if git ls-remote --exit-code --heads origin aux >/dev/null 2>&1; then
                      git checkout aux
                  else
                      git checkout --orphan aux
                      git rm -rf . || true
                  fi

            - name: update latest binaries and versions.json
              run: |
                  mkdir -p sposync/bin/latest
                  cp out/sposync-linux-amd64 sposync/bin/latest/sposync-linux-amd64
                  cp out/sposync-win64.exe sposync/bin/latest/sposync-win64.exe
                  chmod +x sposync/bin/latest/sposync-linux-amd64

                  python - <<'EOF'
                  import hashlib, json, os
                  from datetime import datetime, timezone

                  def sha256(path):
                      h = hashlib.sha256()
                      with open(path, "rb") as f:
                          for chunk in iter(lambda: f.read(1 << 20), b""):
                              h.update(chunk)
                      return h.hexdigest()

                  entry = {
                      "built_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "triggered_by": os.environ["GITHUB_ACTOR"],
                      "commit": os.environ["GITHUB_SHA"],
                      "sha256": {
                          "sposync-linux-amd64": sha256("sposync/bin/latest/sposync-linux-amd64"),
                          "sposync-win64.exe": sha256("sposync/bin/latest/sposync-win64.exe"),
                      },
                  }

                  path = "sposync/bin/versions.json"
                  try:
                      with open(path) as f:
                          data = json.load(f)
                      if not isinstance(data, list):
                          data = [data]
                  except (FileNotFoundError, json.JSONDecodeError):
                      data = []

                  data.append(entry)
                  with open(path, "w", newline="\n") as f:
                      json.dump(data, f, indent=2)
                      f.write("\n")
                  EOF

            - name: commit and push to aux
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -f sposync/bin/latest/sposync-linux-amd64 sposync/bin/latest/sposync-win64.exe sposync/bin/versions.json
                  git commit -m "chore(sposync): publish build ${GITHUB_SHA::7} (triggered by ${GITHUB_ACTOR})"
                  git push origin aux
