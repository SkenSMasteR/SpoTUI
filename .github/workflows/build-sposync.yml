name: build sposync

on:
    push:
        branches:
            - master
        paths:
            - 'sposync/app.py'
            - 'sposync/requirements.txt'

permissions:
    contents: write
    pull-requests: write

jobs:
    build-linux:
        runs-on: ubuntu-latest
        if: github.actor != 'github-actions[bot]'
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: install deps
              run: |
                  python -m pip install --upgrade pip
                  pip install -r sposync/requirements.txt pyinstaller

            - name: build linux binary
              run: |
                  pyinstaller --noconfirm --onefile --name sposync-linux-amd64 --collect-all textual --collect-all rich --collect-all soundcard --collect-all numpy --collect-all websockets sposync/app.py
                  mkdir -p sposync/bin
                  mv dist/sposync-linux-amd64 sposync/bin/sposync-linux-amd64
                  chmod +x sposync/bin/sposync-linux-amd64

            - uses: actions/upload-artifact@v4
              with:
                  name: sposync-linux-amd64
                  path: sposync/bin/sposync-linux-amd64

    build-windows:
        runs-on: windows-latest
        if: github.actor != 'github-actions[bot]'
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: install deps
              run: |
                  python -m pip install --upgrade pip
                  pip install -r sposync/requirements.txt pyinstaller

            - name: build windows binary
              run: |
                  pyinstaller --noconfirm --onefile --name sposync-win64 --collect-all textual --collect-all rich --collect-all soundcard --collect-all numpy --collect-all websockets sposync/app.py
                  New-Item -ItemType Directory -Force -Path sposync/bin | Out-Null
                  Move-Item -Force dist/sposync-win64.exe sposync/bin/sposync-win64.exe

            - uses: actions/upload-artifact@v4
              with:
                  name: sposync-win64
                  path: sposync/bin/sposync-win64.exe

    pr:
        needs: [build-linux, build-windows]
        runs-on: ubuntu-latest
        if: github.actor != 'github-actions[bot]'
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: master
                  fetch-depth: 0

            - uses: actions/download-artifact@v4
              with:
                  name: sposync-linux-amd64
                  path: sposync/bin

            - uses: actions/download-artifact@v4
              with:
                  name: sposync-win64
                  path: sposync/bin

            - name: check for binary changes
              id: check
              run: |
                  chmod +x sposync/bin/sposync-linux-amd64
                  git add -f sposync/bin/sposync-linux-amd64 sposync/bin/sposync-win64.exe
                  if git diff --cached --exit-code --quiet; then
                      echo "binaries are up to date"
                      echo "has_changes=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "has_changes=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: push branch and open PR
              if: steps.check.outputs.has_changes == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  BRANCH="auto/sposync-bin-${{ github.sha }}"
                  if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
                      echo "Branch $BRANCH already exists, nothing to push"
                      exit 0
                  fi
                  git checkout -b "$BRANCH"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git commit -m "chore: update sposync binaries"
                  git push -u origin "$BRANCH"

                  gh pr create \
                      --base master \
                      --head "$BRANCH" \
                      --title "chore: update sposync binaries" \
                      --body "Auto-generated by the build workflow from commit ${{ github.sha }}."
