name: build theme.js

on:
    pull_request_target:
        branches:
            - master

permissions:
    contents: write
    pull-requests: write

jobs:
    build:
        runs-on: ubuntu-latest
        if: github.actor != 'github-actions[bot]'
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: bundle theme.js
              run: npx --yes rollup src/main.js --file theme.js --format iife

            - name: check for bundle changes
              id: check
              run: |
                  git add -f theme.js
                  if git diff --cached --exit-code --quiet; then
                      echo "theme.js is up to date"
                      echo "has_changes=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "has_changes=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: open PR with built theme.js
              if: steps.check.outputs.has_changes == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  BRANCH="auto/theme-js-${{ github.sha }}"
                  git checkout -b "$BRANCH"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git commit -m "chore: update bundled theme.js"
                  git push -u origin "$BRANCH"
                  gh pr create --base master --head "$BRANCH" \
                    --title "chore: update bundled theme.js" \
                    --body "Auto-generated by the build workflow. This PR contains only the bundled \`theme.js\` produced from the latest source in \`master\`." \
                    || echo "PR already exists for this commit"
