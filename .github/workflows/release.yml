name: Build and Release

on:
  push:
    branches:
      - CLI
    paths-ignore:
      - '.github/workflows/lint.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          RELEASE_BRANCHES: CLI

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.new_tag }}

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Rename binary
        run: mv build/spotui build/spotui-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: spotui-linux-amd64
          path: build/spotui-linux-amd64

  build-windows:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-w64-mingw32
            arch: x86
            out: spotui-win32.exe
          - target: x86_64-w64-mingw32
            arch: AMD64
            out: spotui-win64.exe
          - target: aarch64-w64-mingw32
            arch: ARM64
            out: spotui-winarm64.exe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.new_tag }}

      - name: Install llvm-mingw
        run: |
          set -euo pipefail
          url=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest \
            | grep "browser_download_url.*ucrt-ubuntu-22.04-x86_64.tar.xz" \
            | cut -d '"' -f 4)

          echo "Resolved URL: $url"

          if [ -z "$url" ]; then
            echo "Could not find a matching llvm-mingw asset URL" >&2
            exit 1
          fi

          curl -L -o llvm-mingw.tar.xz "$url"
          tar tf llvm-mingw.tar.xz > filelist.txt
          dir=$(head -1 filelist.txt | cut -f1 -d/)
          tar xf llvm-mingw.tar.xz
          echo "$PWD/$dir/bin" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} \
            -DCMAKE_C_COMPILER=${{ matrix.target }}-clang \
            -DCMAKE_CXX_COMPILER=${{ matrix.target }}-clang++

      - name: Build ${{ matrix.out }}
        run: cmake --build build

      - name: Rename binary
        run: mv build/spotui.exe build/${{ matrix.out }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: build/${{ matrix.out }}

  release:
    needs: [version, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: SpoTUI ${{ needs.version.outputs.new_tag }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.version.outputs.new_tag, '-rc') || contains(needs.version.outputs.new_tag, '-beta') }}