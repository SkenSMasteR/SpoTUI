name: build theme bundle

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: master

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: bundle theme.js
              run: npx --yes rollup src/main.js --file theme.js --format iife

            - name: stage bundle
              run: |
                  mkdir -p /tmp/bundle
                  cp theme.js user.css metadata.json color.ini /tmp/bundle/
                  VERSION=$(python3 -c "import json; print(json.load(open('metadata.json'))['version'])")
                  echo "version=$VERSION" >> "$GITHUB_ENV"
                  git checkout -- theme.js

            - name: fetch aux branch
              run: |
                  git fetch origin aux || true
                  if git ls-remote --exit-code --heads origin aux >/dev/null 2>&1; then
                      git checkout aux
                  else
                      git checkout --orphan aux
                      git rm -rf . || true
                  fi

            - name: update latest bundle and versions.json
              env:
                  VERSION: ${{ env.version }}
              run: |
                  mkdir -p spotui/bundled/latest
                  cp /tmp/bundle/theme.js /tmp/bundle/user.css /tmp/bundle/metadata.json /tmp/bundle/color.ini spotui/bundled/latest/

                  python3 - <<'EOF'
                  import hashlib, json, os
                  from datetime import datetime, timezone

                  def sha256(path):
                      h = hashlib.sha256()
                      with open(path, "rb") as f:
                          for chunk in iter(lambda: f.read(1 << 20), b""):
                              h.update(chunk)
                      return h.hexdigest()

                  files = ["theme.js", "user.css", "metadata.json", "color.ini"]
                  entry = {
                      "version": os.environ["VERSION"],
                      "built_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "triggered_by": os.environ["GITHUB_ACTOR"],
                      "commit": os.environ["GITHUB_SHA"],
                      "sha256": {f: sha256(os.path.join("spotui/bundled/latest", f)) for f in files},
                  }

                  path = "spotui/bundled/versions.json"
                  try:
                      with open(path) as f:
                          data = json.load(f)
                          if not isinstance(data, list):
                              data = [data]
                  except (FileNotFoundError, json.JSONDecodeError):
                      data = []

                  data.append(entry)
                  with open(path, "w", newline="\n") as f:
                      json.dump(data, f, indent=2)
                      f.write("\n")
                  EOF

            - name: commit and push to aux
              env:
                  VERSION: ${{ env.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -f spotui/bundled/latest/theme.js spotui/bundled/latest/user.css spotui/bundled/latest/metadata.json spotui/bundled/latest/color.ini spotui/bundled/versions.json
                  git commit -m "chore(theme): publish bundle v${VERSION} (${GITHUB_SHA::7})"
                  git push origin aux
