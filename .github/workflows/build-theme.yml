name: build theme.js

on:
    push:
        branches:
            - master
        paths:
            - 'src/**'

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        if: github.actor != 'github-actions[bot]'
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: master
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: bundle theme.js
              run: npx --yes rollup src/main.js --file theme.js --format iife

            - name: check for bundle changes
              id: check
              run: |
                  git add -f theme.js
                  if git diff --cached --exit-code --quiet; then
                      echo "theme.js is up to date"
                      echo "has_changes=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "has_changes=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: push branch with built theme.js
              if: steps.check.outputs.has_changes == 'true'
              run: |
                  BRANCH="auto/theme-js-${{ github.sha }}"
                  if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
                      echo "Branch $BRANCH already exists, nothing to push"
                      exit 0
                  fi
                  git checkout -b "$BRANCH"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git commit -m "chore: update bundled theme.js"
                  git push -u origin "$BRANCH"
                  echo "Pushed branch $BRANCH - open the PR against master manually"
